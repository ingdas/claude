name: Metro Rush watch face

on:
  push:
    paths:
      - "watchfaces/metro-rush/**"
      - ".github/workflows/metro-rush.yml"
  pull_request:
    paths:
      - "watchfaces/metro-rush/**"
      - ".github/workflows/metro-rush.yml"
  workflow_dispatch:

permissions:
  contents: write   # to commit the built APK back to the branch on push

env:
  # google/watchface commit that provides the official Watch Face Format validator.
  WFF_VALIDATOR_REF: d1cdafa953c95d5554fc54df4bc3948befbefc4d

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchfaces/metro-rush
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generated watchface.xml is up to date
        run: |
          python3 tools/generate.py
          git diff --exit-code -- app/src/main/res/raw/watchface.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate against Watch Face Format v1 (official validator)
        run: |
          git init -q "$RUNNER_TEMP/watchface"
          cd "$RUNNER_TEMP/watchface"
          git fetch -q --depth 1 https://github.com/google/watchface.git "$WFF_VALIDATOR_REF"
          git checkout -q FETCH_HEAD
          cd third_party/wff
          ./gradlew -q --no-daemon :specification:validator:executable-jar
          cd "$GITHUB_WORKSPACE/watchfaces/metro-rush"
          java -jar "$RUNNER_TEMP/watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar" \
            1 --stop-on-fail app/src/main/res/raw/watchface.xml 2>&1 | tee "$RUNNER_TEMP/wff.log"
          # Some failure paths only log; require the explicit PASSED line.
          grep -q "PASSED" "$RUNNER_TEMP/wff.log"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Commit APK to the branch
        if: github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/release/app-release.apk apk/metro-rush.apk
          git add apk/metro-rush.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build metro-rush.apk from ${GITHUB_SHA::7}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: metro-rush-apk
          path: watchfaces/metro-rush/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
